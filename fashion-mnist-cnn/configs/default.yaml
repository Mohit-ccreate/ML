# Default training configuration.
# Any key can be overridden on the command line, e.g.:
#   python train.py --epochs 3 --model mlp --out runs/mlp

seed: 42
device: auto            # auto | cpu | cuda | mps

data:
  dir: data
  batch_size: 128
  val_fraction: 0.1
  augment: true
  num_workers: 0        # bump to 2-4 on a machine with spare cores

model:
  name: cnn             # cnn | mlp
  kwargs:
    width: 32
    dropout: 0.25

train:
  epochs: 10
  lr: 0.003             # peak LR for OneCycleLR
  weight_decay: 0.0005
  label_smoothing: 0.1
  scheduler: onecycle   # onecycle | cosine | none

output:
  dir: runs/cnn
